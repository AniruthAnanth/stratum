# Stratum — machine-readable file ownership manifest (R0, ARCHITECTURE §8.13).
#
# Transcribed VERBATIM from docs/IMPLEMENTATION_PLAN.md §8, which is the prose
# authority. If the two disagree, the plan wins and this file is the bug.
#
# ONE DECLARED DIVERGENCE from §8, pending an ARCHITECT amendment. §8 enumerates
# what the 27 work units will *create*. It does not account for the design-phase
# reference corpus committed before the plan was written, so §8's claim to be
# "the complete partition" is false against the tree — and the check below reads
# the tree, not the table, which is why it reported 17 files owned by nobody.
# They are assigned to the unit whose declared scope already covers them; each
# addition carries a `# not in §8` marker. Putting them under [unowned] was the
# wrong fix: a golden oracle that must be regenerated when Stata's output moves
# is precisely a file that needs a named owner.
#
#   tests/fixtures/dta/**       -> W03   the .dta corpus its reader is built
#                                        against; same shape as W07 owning
#                                        tests/fixtures/mock/** and W00 owning
#                                        tests/fixtures/sdp1/**
#   scripts/capture-golden.sh   -> W23   Stata-invoking capture tooling, beside
#   scripts/stata_diff.py                the scripts/run-stata.sh it owns already
#   tests/golden/README.md      -> W23   "Difftest harness and goldens": these
#   tests/golden/stata18/**              logs are the committed Stata output its
#                                        acceptance is written against
#
# `tests/golden/segmentation/**` stays W11b's. The two new globs are enumerated
# narrowly rather than carved out of a `tests/golden/**` with `exclude`, because
# §8.2 prescribes enumeration and §8 declares exactly one exclusion.
# [meta.counts] therefore reads 200 exact / 75 globs, not §8's 197 / 73.
#
# `cargo xtask ownership` is a required PR check. It reads this file, expands
# every pattern against the tracked working tree, and fails if any tracked file
# is claimed by two units or by none. R0 becomes a test rather than a promise.
#
# ===========================================================================
# SCHEMA (version 1) — the checker codes against exactly this.
# ===========================================================================
#
#   schema = 1                    Integer. Bump only on a breaking shape change.
#
#   [meta]                        Provenance. Informational; no checker behaviour
#     source          String      depends on it.
#     generated_from  String
#     counts          Table       { owners, exact_paths, globs } — the plan's own
#                                 verified totals, for a cheap self-check.
#
#   [[unit]]                      One entry per OWNER. Order is not significant;
#                                 `id` is the primary key and must be unique.
#     id       String  required   "W00".."W26", "W06a".."W06c", or "ARCHITECT".
#     title    String  optional   Human label. Never matched against.
#     owns     [String] required  Repo-relative patterns. May be empty only if
#                                 the unit genuinely owns nothing.
#     exclude  [String] optional  Repo-relative patterns carved OUT of this
#                                 unit's `owns`. Default []. A file matched by
#                                 both `owns` and `exclude` is NOT owned by this
#                                 unit and must be claimed by some other unit.
#
#   [unowned]                     IMPLEMENTATION_PLAN §8.1.
#     paths    [String] required  Patterns that are legitimately owned by nobody.
#                                 A tracked file matching one of these is neither
#                                 an error nor a claim.
#
# PATTERN SEMANTICS (normative — the checker must implement exactly this):
#
#   * Patterns are repo-relative, `/`-separated, never absolute, never leading
#     `./`, and never contain `\`. Compare against paths as `git ls-files`
#     prints them.
#   * Matching uses the `glob` crate's `Pattern` with
#     `MatchOptions { case_sensitive: true, require_literal_separator: true,
#                     require_literal_leading_dot: false }`.
#     So `*` and `?` do NOT cross `/`; `**` does; and a pattern beginning `.`
#     (e.g. `.github/workflows/ci.yml`) matches a dotfile.
#   * A pattern with no metacharacter is an EXACT path: it names one file rather
#     than a set, so an exact path matching no tracked file is reported by name.
#     Its SEVERITY is governed by `[meta] complete`, not by the pattern shape.
#     While the tree is incomplete, "claimed but not tracked" cannot be told
#     apart from "not written yet" — §8 enumerates what the 27 units WILL create
#     — so the checker reports it and continues. Once `complete = true`, the same
#     condition is exactly the rename-silently-unowns-a-file bug and is an error.
#     `--strict-paths` forces that reading early. Globs are allowed to match
#     nothing under either setting and are always a WARNING.
#
#     Two conditions are fatal with no flag and no setting, because
#     ARCHITECTURE §8.13 makes only these two fatal: a tracked file claimed by
#     two units, and a tracked file claimed by none.
#   * `dir/**` matches every file at any depth under `dir/`. It does NOT match
#     `dir` itself (git tracks files, not directories).
#   * Untracked files are skipped entirely (§8.1): a build artifact never trips
#     the check. Use `git ls-files` — not a filesystem walk — as the input set.
#     `--include-untracked` is the one opt-in past this, and it is a PREFLIGHT,
#     not a second reading of §8.1: it adds `git ls-files --others
#     --exclude-standard` (so `.gitignore` still decides what an artifact is),
#     attributes those files exactly as above, and prints the verdict in its own
#     `preflight —` section that never changes the exit code. During a parallel
#     wave most of the tree is written and uncommitted, and the tracked-only
#     answer is then both too quiet — it certifies a partition over whatever
#     minority is in the index — and too loud, because a file finished on disk
#     is reported as "claimed but not tracked". The alternative people reach for
#     is to copy the tree, `git init`, `git add -A` and check that, which also
#     stages every scratch file lying around and calls it an R0 violation. That
#     is what happened in wave 1 (a root `sync.sh` nobody was going to commit).
#     Ask in place instead: `cargo xtask ownership --include-untracked`.
#
# CHECK ALGORITHM:
#
#   1. Build the tracked set with `git ls-files`.
#   2. Drop every path matching an `[unowned]` pattern.
#   3. For each remaining path, collect every unit whose `owns` matches it and
#      whose `exclude` does not.
#   4. len(claims) == 0  -> error "unowned".
#      len(claims) >  1  -> error "claimed by {units}".
#      len(claims) == 1  -> ok.
#   5. Separately, error on any duplicate `unit.id`, and on any exact `owns`
#      path that matched nothing.
#
# `xtask ownership` ships with a negative test: adding a path to two units'
# globs, or to none, must fail it (IMPLEMENTATION_PLAN W00 acceptance).
# ===========================================================================

schema = 1

[meta]
source = "docs/IMPLEMENTATION_PLAN.md §8"
generated_from = "IMPLEMENTATION_PLAN.md §8 owner table, transcribed verbatim"

# Does the tree contain every file §8 enumerates? W00 is the only landed unit,
# so no. FLIP THIS TO `true` WHEN THE LAST WORK UNIT LANDS: an exact path that
# matches nothing then stops being "not written yet" and becomes the
# rename-silently-unowns-a-file bug the exact-path rule exists to catch.
complete = false

[meta.counts]
# The plan's verified totals (34 / 197 / 73), plus the six patterns of the
# declared divergence above, plus the two ARCHITECT amendments of 2026-08-22
# (`apps/desktop/pnpm-lock.yaml`, `apps/desktop/src/ipc/hand.test.ts`), both
# exact and both W12's, plus `crates/stratum-parse/fuzz/{Cargo.toml,.gitignore}`
# (W04, repair round 1 — see the comments on them), plus the SITE unit of
# 2026-08-23 (`site/**` glob, `.github/workflows/site.yml` exact). `xtask
# ownership` asserts these as a transcription check; they are not a constraint
# on the tree.
owners = 35
exact_paths = 211
globs = 76


