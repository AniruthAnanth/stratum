# IMPLEMENTATION_PLAN §8.1 — directories deliberately owned by nobody.
# `xtask ownership` skips untracked files anyway, so these entries only matter
# for the rare case where one of these paths is force-added to the index.
[unowned]
paths = [
  "target/**",
  "**/node_modules/**",
  ".stratum/**",
  "**/dist/**",
