# This file is meant to be generated by `cargo hakari`.
#
# To regenerate it:
#     cargo install cargo-hakari
#     cargo hakari init            # writes .config/hakari.toml (see README.md)
#     cargo hakari generate        # rewrites the HAKARI SECTION below
#     cargo hakari manage-deps     # adds the dep line to every workspace member
#
# It is committed on purpose (08 §11.3): cargo-hakari cannot work from a file
# that is regenerated at build time, because the unification has to be visible
# to cargo's resolver before the build starts.
#
# The HAKARI SECTION is currently EMPTY, and that is the correct state today
# rather than a stub. Hakari's whole job is to union the feature sets that
# different workspace members select for a shared dependency; W00 ships two
# crates, `stratum-proto` and `stratum-tokens`, and the only third-party
# dependencies in the tree at all are proto's four. There is nothing to unify
# until several members have selected conflicting feature sets, so generating
# now would commit an artifact that is wrong by the time it matters.
#
# See README.md for who turns it on and when.

[package]
name = "stratum-workspace-hack"
description = "workspace-hack package, managed by cargo-hakari"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# Hakari's own convention. Without it, `cargo publish` on any member would try
# to resolve this crate from a registry, and `cargo package` would refuse.
[lib]
path = "src/lib.rs"

### BEGIN HAKARI SECTION
### END HAKARI SECTION
